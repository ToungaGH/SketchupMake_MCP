[project]
name = "sketchup-mcp"
version = "2.0.0+make2017"
description = "MCP server that bridges AI assistants to SketchUp Make 2017 via HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "sketchup", "claude", "3d-modeling", "ai"]

dependencies = [
    "httpx>=0.27.0,<1",
    "mcp>=1.2,<2",
]

[project.scripts]
sketchup-mcp = "sketchup_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sketchup_mcp"]
